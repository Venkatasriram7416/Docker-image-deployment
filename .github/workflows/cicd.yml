
name: CI/CD for Dockerized Flask App # Name of the workflow

# Events: Run when code is pushed to main or a PR targets main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows us to run the workflow manually from GitHub
  workflow_dispatch:

# Give read permission to the repository
permissions:
  contents: read

jobs:

  # Job 1: Build and test the Flask application
  build-and-test:
    runs-on: ubuntu-latest # Latest Ubuntu runner

    steps:
      # Step 1: Checkout the GitHub repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # Step 4: Run unit tests
      # pytest finds test_*.py files and test_* functions
      - name: Run tests
        run: |
          python -m pytest -v

  # Job 2: Build Docker image and publish to Docker Hub
  build-and-publish:
    needs: build-and-test # Run after tests pass
    runs-on: ubuntu-latest

    # Publish on pushes to main, not pull requests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v7

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and push Docker image
      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./DockerFile # Matches your current filename
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/flasktest-app:latest

      # Step 5: Display the Docker image digest
      - name: Image digest
        run: echo "Image digest ${{ steps.docker_build.outputs.digest }}"

# Workflow summary:
# 1. Push code or create a pull request for main.
# 2. GitHub checks out the repository.
# 3. Python and dependencies are installed.
# 4. pytest runs the unit tests.
# 5. If tests pass, Docker builds the image.
# 6. GitHub logs in to Docker Hub using secrets.
# 7. Docker image is pushed to Docker Hub...
# 8. The image digest is displayed.
